config_dir: config/workflows
db_path: claudius.db
workspaces_path: data/workspaces
image: claudius:latest
docker_probe_mode: host_port
host: 0.0.0.0
port: 8000
callback_url: http://host.docker.internal:8000
attachments: file:///tmp/claudius-attachments
log_conversation: false

# Resend inbound email is webhook-based. In local dev, expose this controller on a
# public HTTPS URL with a tunnel (for example `cloudflared tunnel --url
# http://localhost:8000`) and point Resend's email.received webhook at that URL
# plus /webhook/resend.

