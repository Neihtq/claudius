[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudius"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "loguru>=0.7.0",
    "pyjwt>=2.12.1",
    "markdown>=3.7",
]

[project.scripts]
claudius = "claudius.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/claudius"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
